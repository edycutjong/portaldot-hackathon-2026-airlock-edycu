[project]
name = "airlock"
version = "0.0.1"
description = "Time-locked hot key for a Portaldot pure-proxy vault: every spend is announced, waits out a delay, and can be vetoed by the cold key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "substrate-interface==1.8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["airlock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "chain: needs a running node at AIRLOCK_WS (skipped otherwise)",
]
