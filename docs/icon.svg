<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Airlock — the cold key vetoes a hot key’s announced spend: 11.42 tPOT announced at #166811 · 10-block delay — and a red VOID stamp lands across it.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: black plate, paper hold ticket, block 1 elapsed (amber), blocks 2-4 remaining (hollow) — the poster
  10-42%  trigger:      the countdown advances — block 2 fills with hold amber from left to right              data-story="beat-2"
  42-55%  mechanism:    11.42 tPOT announced at #166811 · 10-block delay — and a red VOID stamp lands across it.  (icon form: the vermilion cut line drops at the "now" boundary, cut marks snap in) data-story="beat-3"
  55-88%  resolution:   the cut persists at the now line; blocks 3-4 stay hollow; stamp ink breathes           data-story="beat-4"
  88-100% breathe + seam fade: cut and block-2 fill fade out, back to the poster
-->
<style>
  .snap { transform-box: fill-box; transform-origin: center; animation: snap 6s cubic-bezier(.2,1.4,.4,1) infinite; }
  @keyframes snap { 0%, 43% { transform: scale(1.6) } 47% { transform: scale(.94) } 50%, 100% { transform: scale(1) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
