[project]
name = "airlock"
version = "0.0.1"
description = "Time-locked hot key for a Portaldot pure-proxy vault: every spend is announced, waits out a delay, and can be vetoed by the cold key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "substrate-interface==1.8.1",
  "scalecodec==1.2.12",
]

[project.scripts]
airlock = "airlock.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["airlock*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# substrate-interface pulls in no async code; keep a globally installed pytest-asyncio from loading
addopts = "-p no:asyncio"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
